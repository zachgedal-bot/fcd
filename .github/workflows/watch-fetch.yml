name: watch-fetch
on:
  push:
    branches: [claude/elegant-dirac-g21kpz]
    paths: [watch/trigger.txt]
  workflow_dispatch:
    inputs:
      event_slug:
        description: Polymarket event slug
        default: highest-temperature-in-singapore-on-october-5-2026
      icao:
        default: WSSS
      lat:
        default: "1.3644"
      lon:
        default: "103.9915"
      tzn:
        default: Asia/Singapore
      sg_date:
        default: "2026-10-05"
      wu_date:
        default: "20261005"
permissions:
  contents: write
concurrency:
  group: watch-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Fetch sources
        env:
          EVENT_SLUG: ${{ inputs.event_slug }}
          ICAO: ${{ inputs.icao }}
          LAT: ${{ inputs.lat }}
          LON: ${{ inputs.lon }}
          TZN: ${{ inputs.tzn }}
          SG_DATE: ${{ inputs.sg_date }}
          WU_DATE: ${{ inputs.wu_date }}
        run: |
          # On push events inputs are empty; the trigger file may carry KEY=VALUE overrides.
          if [ -f watch/trigger.txt ]; then set -a; . <(grep -E '^[A-Z_]+=' watch/trigger.txt || true); set +a; fi
          bash watch/fetch.sh
      - name: Commit results
        run: |
          git config user.name "watch-fetch[bot]"
          git config user.email "watch-fetch@users.noreply.github.com"
          git add -A watch/latest watch/hist
          git commit -m "watch: fetch $(cat watch/latest/fetched_at_utc.txt) [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && break; sleep 5; done
