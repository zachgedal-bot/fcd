app = "athlemix-after-hours"
primary_region = "lax"

[build]

[env]
  PORT = "8080"
  TRUST_PROXY = "1"
  HOME_URL = "https://athlemix.com"
  ODDS_REGIONS = "us,eu"
  ODDS_CACHE_SECONDS = "300"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"
